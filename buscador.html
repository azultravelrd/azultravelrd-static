<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Buscador de Viajes | Azul Travel RD</title>
  
  <!-- Favicon -->
  <link rel="icon" href="./images/favicon.png" type="image/png">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="./css/style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita doble barra de desplazamiento */
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }
    
    /* El contenedor principal ocupa el espacio restante debajo del header */
    .search-engine-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - 80px); /* Resta la altura del header */
    }

    .iframe-engine {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Encabezado / Navegación Oficial -->
  <header class="header">
    <div class="container header-container">
      <a href="./" class="logo-link">
        <img src="./images/logo.png" alt="Azul Travel RD Logo" class="logo-img">
        <span class="site-title">AZUL TRAVEL RD</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-menu" id="navMenu">
        <!-- Este menú se rellenará automáticamente desde nav-data.js -->
        <ul id="navList"></ul>
      </nav>
    </div>
  </header>

  <!-- Contenedor del Motor de Suplitur a pantalla completa -->
  <main class="search-engine-wrapper">
    <iframe 
      id="engineIframe" 
      class="iframe-engine" 
      src="https://www.suplitur.com/es/microsite/azul-travel/engine/iframe" 
      allowfullscreen>
    </iframe>
  </main>

  <!-- Scripts en orden estricto de dependencia -->
  <script src="./js/nav-data.js"></script>
  <script src="./js/search-form-component.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
